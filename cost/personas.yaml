# Mô phỏng chi phí khi dùng thật — TripSwipe (guide bước 4.2).
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — không commit file try)
#       python run.py simulate --rate-from eval/run-3.csv   (50 phiên — bản nộp CP4)

sessions: 50
seed: 42

users:
  low: 500
  base: 1000
  high: 3000
  source: "Người phụ trách lên lịch cho nhóm bạn 18–30 tuổi đi chơi nội thành Hà Nội (mốc cơ sở 1.000 người khớp spec.md §2; cả 3 kịch bản: tự ước tính)"

personas:
  - name: dung_it
    share: 0.55
    uses_per_month: 0.33
    turns_per_session: 1
    source: "Khảo sát 31 người lên lịch (evidence/summary.md, spec.md §2): 17/31 (55%) lên lịch 1 lần / 3 tháng (0,33 lần/tháng); turns_per_session: tự ước tính"
  - name: dung_vua
    share: 0.35
    uses_per_month: 0.83
    turns_per_session: 2
    source: "Khảo sát 31 người lên lịch (evidence/summary.md, spec.md §2): 11/31 (35%) lên lịch 2–3 lần / 3 tháng (0,83 lần/tháng); turns_per_session: tự ước tính"
  - name: dung_nhieu
    share: 0.10
    uses_per_month: 1.33
    turns_per_session: 3
    source: "Khảo sát 31 người lên lịch (evidence/summary.md, spec.md §2): 3/31 (10%) lên lịch >= 4 lần / 3 tháng (>= 1,33 lần/tháng); turns_per_session: tự ước tính"

prices:
