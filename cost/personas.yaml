  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing (tham chiếu mẫu khung) · xem 28/11/2026"
  - model: gpt-4.1-mini
    input: 0.40
    output: 1.60
    source: "https://openai.com/api/pricing/ · xem 28/11/2026"
  - model: gpt-4.1
