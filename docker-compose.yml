services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tripswipe
      POSTGRES_PASSWORD: ${TRIPSWIPE_DB_PASSWORD:-tripswipe_local_only}
      POSTGRES_DB: tripswipe
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripswipe -d tripswipe"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://tripswipe:${TRIPSWIPE_DB_PASSWORD:-tripswipe_local_only}@db:5432/tripswipe
    # Model thật cho AI chọn thẻ lấy từ file env của repo; không có file thì chạy model giả.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${TRIPSWIPE_PORT:-9000}:9000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
volumes:
  postgres-data:
