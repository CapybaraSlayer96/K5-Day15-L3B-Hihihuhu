<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}TripSwipe{% endblock %} · TripSwipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&subset=vietnamese&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0e0d0c">
  <script>
    // Đặt chủ đề trước khi vẽ để không nháy: lựa chọn đã lưu, không có thì theo hệ điều hành.
    (() => {
      let t = null;
      try { t = localStorage.getItem("tripswipe:theme"); } catch {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f4f1eb" : "#0e0d0c";
    })();
  </script>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/base.css">
</head>
<body data-code="{{ code or '' }}">
  <header class="bar">
    <a class="brand" href="/" aria-label="TripSwipe, trang chủ"><img src="/static/brand/mark.svg" width="28" height="28" alt="">TripSwipe</a>
    {% if code %}
    <nav class="steps" aria-label="Các bước">
      <a href="/g/{{ code }}/swipe" {% if page == 'swipe' %}aria-current="page"{% endif %}>Quẹt thẻ</a>
      <a href="/g/{{ code }}/lobby" {% if page == 'lobby' %}aria-current="page"{% endif %}>Phòng chờ</a>
      <a href="/g/{{ code }}/itinerary" {% if page == 'itinerary' %}aria-current="page"{% endif %}>Lịch trình</a>
      <a href="/g/{{ code }}/dashboard" {% if page == 'dashboard' %}aria-current="page"{% endif %}>Bảng tổng quan</a>
    </nav>
    <div class="bar-end"><span class="code-tag" title="Mã nhóm">{{ code }}</span><span id="who" class="muted"></span></div>
    {% endif %}
    <button type="button" class="btn theme-toggle" id="theme-toggle" aria-label="Chuyển sang chế độ sáng">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
  </header>
  <main class="{% block main_class %}{% endblock %}">{% block body %}{% endblock %}</main>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
