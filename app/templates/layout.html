<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}TripSwipe{% endblock %} · TripSwipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&subset=vietnamese&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0e0d0c">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/base.css">
</head>
<body data-code="{{ code or '' }}">
  <header class="bar">
    <a class="brand" href="/" aria-label="TripSwipe, trang chủ"><img src="/static/brand/mark.svg" width="28" height="28" alt="">TripSwipe</a>
    {% if code %}
    <nav class="steps" aria-label="Các bước">
      <a href="/g/{{ code }}/swipe" {% if page == 'swipe' %}aria-current="page"{% endif %}>Quẹt thẻ</a>
      <a href="/g/{{ code }}/lobby" {% if page == 'lobby' %}aria-current="page"{% endif %}>Phòng chờ</a>
      <a href="/g/{{ code }}/itinerary" {% if page == 'itinerary' %}aria-current="page"{% endif %}>Lịch trình</a>
      <a href="/g/{{ code }}/dashboard" {% if page == 'dashboard' %}aria-current="page"{% endif %}>Bảng tổng quan</a>
    </nav>
    <div class="bar-end"><span class="code-tag" title="Mã nhóm">{{ code }}</span><span id="who" class="muted"></span></div>
    {% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">{% block body %}{% endblock %}</main>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
